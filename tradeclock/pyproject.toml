[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeclock"
version = "1.0.0"
description = "IST Trade-Window Research Pipeline & Live Terminal for BTC and Gold Perps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
]

[project.scripts]
tradeclock = "tradeclock.terminal.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
